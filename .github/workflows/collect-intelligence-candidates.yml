name: Collect Security Intelligence Candidates

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback window in days"
        required: true
        default: "7"

permissions:
  contents: write
  pull-requests: write

jobs:
  collect-candidates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect raw candidates
        id: collect
        run: |
          python scripts/collect_intelligence_candidates.py \
            --days "${{ inputs.days }}" \
            --output-json "${RUNNER_TEMP}/raw-candidates-${GITHUB_RUN_ID}.json" \
            --output-md "${RUNNER_TEMP}/raw-candidates-${GITHUB_RUN_ID}.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Triage candidates
        id: triage
        if: steps.collect.outputs.candidate_count != '0'
        run: |
          python scripts/triage_intelligence_candidates.py \
            --input-json "${{ steps.collect.outputs.candidate_json }}" \
            --output-json ".automation-review/candidates-${GITHUB_RUN_ID}.json" \
            --output-md ".automation-review/candidates-${GITHUB_RUN_ID}.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Add collection summary
        if: steps.collect.outputs.candidate_count == '0'
        run: |
          cat "${{ steps.collect.outputs.candidate_md }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Add triage summary
        if: steps.collect.outputs.candidate_count != '0'
        run: |
          cat "${{ steps.triage.outputs.candidate_md }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create triage review pull request
        if: steps.collect.outputs.candidate_count != '0'
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ github.repository_owner }}
          REVIEW_TITLE: "[Triage Review] Security Intelligence source scan"
          REVIEW_BODY: |
            Automated source collection found **${{ steps.triage.outputs.candidate_count }}**
            candidate(s) and applied deterministic routing.

            - Library: **${{ steps.triage.outputs.library_count }}**
            - Vulnerability: **${{ steps.triage.outputs.vulnerability_count }}**
            - Watch: **${{ steps.triage.outputs.watch_count }}**

            Please review the candidate metadata, source links, and recommended routes.

            **Approve + merge** confirms this triage result.
            Only candidates routed to **Library** are eligible for the future article-drafting phase.
            This PR does not publish any Library article.
          COMMIT_MESSAGE: "Add Security Intelligence triage review"
          BRANCH_PREFIX: "automation/triage-review"
        run: scripts/open_review_pr.sh

      - name: No candidate notice
        if: steps.collect.outputs.candidate_count == '0'
        run: |
          echo "No new candidates were found; no review PR was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Show review link
        if: steps.collect.outputs.candidate_count != '0'
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Human review" >> "$GITHUB_STEP_SUMMARY"
          echo "PR: ${{ steps.review.outputs.pr_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A review was requested from @${{ github.repository_owner }}." >> "$GITHUB_STEP_SUMMARY"
