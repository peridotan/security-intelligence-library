name: Publish Security Intelligence Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Threat Investigation data
        uses: actions/checkout@v7
        with:
          repository: peridotan/threat-investigation-dashboard
          path: .suite/threat-investigation-dashboard

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate derived indexes
        run: python scripts/build_indexes.py

      - name: Generate intelligence context index
        run: python scripts/build_context_index.py

      - name: Synchronize article metadata
        run: python scripts/sync_article_metadata.py

      - name: Check content quality and rights
        run: python scripts/check_content.py

      - name: Check Suite handoff contracts
        run: >
          python scripts/check_suite_handoff.py
          --threat-data
          .suite/threat-investigation-dashboard/data/dashboard.json

      - name: Verify generated source is committed
        run: git diff --exit-code -- docs

      - name: Build site
        run: zensical build --clean --strict

      - name: Check generated HTML
        run: python scripts/check_generated_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
