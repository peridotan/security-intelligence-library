name: Publish Security Intelligence Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout Threat Investigation data
        uses: actions/checkout@v7
        with:
          repository: peridotan/threat-investigation-dashboard
          path: .suite/threat-investigation-dashboard

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate derived indexes
        run: python scripts/build_indexes.py

      - name: Generate intelligence context index
        run: python scripts/build_context_index.py

      - name: Synchronize article metadata
        run: python scripts/sync_article_metadata.py

      - name: Check content quality and rights
        run: python scripts/check_content.py

      - name: Check Suite handoff contracts
        run: >
          python scripts/check_suite_handoff.py
          --threat-data
          .suite/threat-investigation-dashboard/data/dashboard.json

      - name: Verify generated source is committed
        run: git diff --exit-code -- docs

      - name: Build site
        run: zensical build --clean --strict

      - name: Check generated HTML
        run: python scripts/check_generated_site.py

      - name: Upload Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for uploaded Pages artifact to become visible
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          for attempt in {1..12}; do
            if result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME&per_page=100"); then
              if jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '
                [.artifacts[] | select(.name == $name and .expired == false)] |
                length == 1 and (.[0].id | tostring) == $id
              ' <<< "$result" >/dev/null; then
                echo "Expected Pages artifact is visible: $ARTIFACT_ID"
                exit 0
              fi
            fi
            echo "Artifact not yet uniquely visible (attempt $attempt/12)"
            sleep 5
          done
          echo "::error::Expected Pages artifact not uniquely visible; refusing deployment"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify deployed Pages content
        timeout-minutes: 12
        run: python scripts/check_deployed_site.py --revision "${{ github.sha }}"
