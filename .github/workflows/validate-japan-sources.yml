name: Validate Japanese Security Sources

on:
  pull_request:
    paths:
      - "config/intelligence_sources.yml"
      - "scripts/collect_intelligence_candidates.py"
      - "scripts/official_html_sources.py"
      - "scripts/official_csv_sources.py"
      - "scripts/test_official_csv_sources.py"
      - "scripts/test_official_html_sources.py"
      - "scripts/probe_japan_sources.py"
      - ".github/workflows/validate-japan-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install minimal dependencies
        run: python -m pip install PyYAML

      - name: Compile collection scripts
        run: python -m compileall -q scripts/official_html_sources.py scripts/official_csv_sources.py scripts/collect_intelligence_candidates.py scripts/probe_japan_sources.py

      - name: Run official source adapter regressions
        run: python -m unittest discover -s scripts -p "test_official_*_sources.py" -v

      - name: Probe four live Japanese primary sources
        run: python scripts/probe_japan_sources.py
