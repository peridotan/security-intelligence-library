version: 1

# Security Intelligence source registry.
# Primary / first-party feeds are preferred. Most newly added sources route to
# Watch by default so source expansion does not automatically create articles.
sources:
  # Standards / government / national CERT
  - id: nist-cybersecurity
    name: NIST Cybersecurity
    type: rss
    url: https://www.nist.gov/news-events/cybersecurity/rss.xml
    enabled: true
    category_hint: regulation
    trust: primary

  # cisa.gov blocks GitHub-hosted runners for this RSS endpoint (HTTP 403).
  # Use CISA's own verified GitHub organization and its CSAF IT feed instead.
  - id: cisa-csaf-it
    name: CISA CSAF IT Advisories
    type: json_feed
    url: https://raw.githubusercontent.com/cisagov/CSAF/develop/csaf_files/IT/white/cisa-csaf-it-feed-tlp-white.json
    enabled: true
    entry_path: feed.entry
    field_map:
      title: title
      link: content.src
      published: published
      updated: updated
    link_transform: github_raw_to_blob
    category_hint: cybersecurity
    trust: primary

  - id: jpcert-alerts
    name: JPCERT/CC Alerts
    type: rss
    url: https://www.jpcert.or.jp/english/rss/jpcert-en.rdf
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: jpcert-blog
    name: JPCERT/CC Blog
    type: rss
    url: https://blogs.jpcert.or.jp/en/atom.xml
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: ncsc-reports
    name: UK NCSC Reports
    type: rss
    url: https://www.ncsc.gov.uk/api/1/services/v1/report-rss-feed.xml
    enabled: true
    category_hint: risk-management
    trust: primary

  # Japanese primary-source expansion (pilot): publish no articles automatically.
  # NICT's press listing is a server-rendered alternative to the CYNEX Library.
  # Filter NICT press releases to security-related titles; other research excluded.
  - id: nict-security-press
    name: NICT Security Press Releases
    type: html_listing
    url: https://www.nict.go.jp/press/
    html_strategy: nict_press
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: ipa-security-alerts
    name: IPA Security Alerts (Japanese)
    type: rss
    url: https://www.ipa.go.jp/security/rss/alert.rdf
    enabled: true
    category_hint: cybersecurity
    trust: primary

  # Add Japanese first-party feed while retaining existing English coverage.
  # Do not use the JPCERT/CC combined feed: it includes a large volume of JVN CVEs.
  - id: jpcert-alerts-jp
    name: JPCERT/CC Alerts (Japanese)
    type: rss
    url: https://www.jpcert.or.jp/rss/jpcert.rdf
    enabled: true
    category_hint: cybersecurity
    trust: primary

  # HTML adapter is provisional until verified against live GitHub Actions runner.
  # Failures must surface as source_errors, never be treated as successful ingestion.
  - id: nco-security-news
    name: National Cybersecurity Office (Japan) News
    type: html_listing
    url: https://www.cyber.go.jp/news/list/index.html
    html_strategy: nco_news
    enabled: true
    category_hint: regulation
    trust: primary

  # Vendor / platform first-party security feeds
  # The MSRC Update Guide emits thousands of CVE records and minor metadata
  # updates. That signal belongs in Vulnerability Intelligence rather than the
  # Library candidate queue.
  - id: msrc-security-update-guide
    name: Microsoft Security Response Center
    type: rss
    url: https://api.msrc.microsoft.com/update-guide/rss
    enabled: false
    category_hint: cybersecurity
    trust: primary

  - id: microsoft-security-blog
    name: Microsoft Security Blog
    type: rss
    url: https://www.microsoft.com/en-us/security/blog/feed/
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: google-security-blog
    name: Google Security Blog
    type: rss
    url: https://security.googleblog.com/feeds/posts/default
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: okta-security
    name: Okta Security
    type: rss
    url: https://sec.okta.com/rss.xml
    enabled: true
    category_hint: identity-security
    trust: primary

  - id: aws-security-blog
    name: AWS Security Blog
    type: rss
    url: https://aws.amazon.com/blogs/security/feed/
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: cloudflare-blog
    name: Cloudflare Blog
    type: rss
    url: https://blog.cloudflare.com/rss/
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: unit42
    name: Palo Alto Networks Unit 42
    type: rss
    url: https://unit42.paloaltonetworks.com/feed/
    enabled: true
    category_hint: cybersecurity
    trust: primary

  - id: crowdstrike-blog
    name: CrowdStrike Blog
    type: rss
    url: https://www.crowdstrike.com/en-us/blog/feed/
    enabled: true
    category_hint: cybersecurity
    trust: primary
