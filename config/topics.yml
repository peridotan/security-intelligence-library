version: 1
groups:
- name: AI Security
  topics:
  - id: ai-agent-security
    name: AI Agent Security
    description: AI Agentの自律性、Tool利用、Sandbox、Identity、停止・監視を横断する。
  - id: mcp-security
    name: MCP Security
    description: MCP Server / Tool / Metadata / Local Control Planeに関するSecurity。
  - id: ai-governance
    name: AI Governance
    description: 生成AI・AI Systemの利用統制、継続評価、責任・Risk管理。
  - id: ai-cyber-capability
    name: AI Cyber Capability
    description: Frontier / Open-weight Modelの攻撃・脆弱性探索能力とCapability Evaluation。
  - id: ai-enabled-threats
    name: AI-Enabled Threats
    description: 攻撃・Malware・Ransomware・OT標的活動にAIが組み込まれる脅威。
  - id: ai-infrastructure
    name: AI Infrastructure
    description: GPU、AI Data Center、Model / Dataset / RuntimeなどAI基盤の保護。
  - id: ai-for-security
    name: AI for Security
    description: 脆弱性発見・検知・対応など、防御側でAIを活用するテーマ。
- name: Identity
  topics:
  - id: identity-security
    name: Identity Security
    description: 人・Workload・NHI・AI Agentを含むIdentityの認証・認可・監視。
  - id: passkey-phishing-resistant-mfa
    name: Passkey & Phishing-resistant MFA
    description: Passkey / FIDO2と、登録・回復を含むフィッシング耐性認証。
  - id: credential-attacks
    name: Credential Attacks
    description: Password Spraying、MFA Fatigue、漏えい資格情報、Recovery悪用。
  - id: pqc-crypto-agility
    name: PQC / Crypto Agility
    description: Post-Quantum CryptographyとIdentity / Credentialの移行設計。
- name: Cyber Operations
  topics:
  - id: vulnerability-management
    name: Vulnerability Management
    description: 実悪用、KEV / EPSS、Patch優先度、Exploit Windowを含む脆弱性管理。
  - id: ransomware-resilience
    name: Ransomware & Resilience
    description: Ransomware対策、Backup / Restore、Business Resilience。
  - id: ot-critical-infrastructure
    name: OT / Critical Infrastructure
    description: OT / ICS、重要インフラ、Remote Access、Recovery、Safety。
  - id: software-supply-chain
    name: Software Supply Chain
    description: npm、Framework、Package、Tool等の開発・Software Supply Chain Risk。
- name: Governance & Risk
  topics:
  - id: third-party-risk-c-scrm
    name: Third-party Risk / C-SCRM
    description: Supplier、委託先、Cloud / Software依存を含むCyber Supply Chain Risk。
  - id: regulation-policy
    name: Regulation & Policy
    description: AI・Cybersecurity・重要インフラに関する法規制・政策・公的Guidance。
  - id: security-governance-risk
    name: Security Governance & Risk Management
    description: 技術対策を経営Risk、計画、優先順位、残余Riskへ接続する。
