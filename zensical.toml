[project]
site_name = "Security Intelligence Library"
site_url = "https://peridotan.github.io/security-intelligence-library/"
site_description = "Cybersecurity, AI, Identity, Regulation and Risk Management intelligence library."
site_author = "peridotan"
docs_dir = "docs"
site_dir = "site"
repo_url = "https://github.com/peridotan/security-intelligence-library"
repo_name = "peridotan/security-intelligence-library"
copyright = "&copy; 2026 peridotan. All rights reserved."
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Monthly Intelligence" = "monthly/index.md" },
  { "Cybersecurity" = "cybersecurity/index.md" },
  { "Identity Security" = "identity-security/index.md" },
  { "AI Security" = "ai-security/index.md" },
  { "Regulation" = "regulation/index.md" },
  { "Management View" = "risk-management/index.md" },
  { "Topics" = "topics/index.md" },
  { "About" = "about/index.md" },
]

[project.theme]
font = false
variant = "modern"
language = "ja"
features = [
  "navigation.instant", "navigation.tabs", "navigation.sections",
  "navigation.path", "navigation.indexes", "navigation.footer",
  "search.highlight", "content.action.view",
  "content.footnote.tooltips",
]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
admonition = {}
tables = {}
footnotes = {}

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/peridotan/security-intelligence-library"
name = "Security Intelligence Library on GitHub"
